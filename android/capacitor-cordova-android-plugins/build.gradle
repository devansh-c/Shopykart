// Standard Capacitor Cordova Plugins build file
apply plugin: 'com.android.library'

android {
    namespace "app.capacitor.cordova.android.plugins"
    compileSdk 34
    defaultConfig {
        minSdk 23
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.capacitorjs:android:6.0.0"
}
