
name: Build Shopykart iOS Hexa Apps

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      # 1. CUSTOMER
      - name: Build Customer
        run: |
          npm run build:static
          sed -i '' "s/appId: '.*'/appId: 'co.in.shopykart.app'/" capacitor.config.ts
          npx cap sync ios
          cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/Shopykart-Customer.xcarchive archive PRODUCT_BUNDLE_IDENTIFIER=co.in.shopykart.app CODE_SIGNING_ALLOWED=NO

      # 2. ADMIN
      - name: Build Admin
        env:
          NEXT_PUBLIC_ADMIN_APP: true
        run: |
          npm run build:admin
          sed -i '' "s/appId: '.*'/appId: 'co.in.shopykart.admin'/" capacitor.config.ts
          npx cap sync ios
          cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/Shopykart-Admin.xcarchive archive PRODUCT_BUNDLE_IDENTIFIER=co.in.shopykart.admin CODE_SIGNING_ALLOWED=NO

      # 3. BIZ
      - name: Build Biz
        env:
          NEXT_PUBLIC_BIZ_APP: true
        run: |
          npm run build:biz
          sed -i '' "s/appId: '.*'/appId: 'co.in.shopykart.biz'/" capacitor.config.ts
          npx cap sync ios
          cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/Shopykart-Biz.xcarchive archive PRODUCT_BUNDLE_IDENTIFIER=co.in.shopykart.biz CODE_SIGNING_ALLOWED=NO

      # 4. FLEET
      - name: Build Fleet
        env:
          NEXT_PUBLIC_TOW_APP: true
        run: |
          npm run build:tow
          sed -i '' "s/appId: '.*'/appId: 'co.in.shopykart.tow'/" capacitor.config.ts
          npx cap sync ios
          cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/Shopykart-Fleet.xcarchive archive PRODUCT_BUNDLE_IDENTIFIER=co.in.shopykart.tow CODE_SIGNING_ALLOWED=NO

      # 5. HOTEL
      - name: Build Hotel
        env:
          NEXT_PUBLIC_HOTEL_APP: true
        run: |
          npm run build:hotel
          sed -i '' "s/appId: '.*'/appId: 'co.in.shopykart.hotel'/" capacitor.config.ts
          npx cap sync ios
          cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/Shopykart-Hotel.xcarchive archive PRODUCT_BUNDLE_IDENTIFIER=co.in.shopykart.hotel CODE_SIGNING_ALLOWED=NO

      # 6. HOTEL BIZ
      - name: Build HotelBiz
        env:
          NEXT_PUBLIC_HOTEL_BIZ_APP: true
        run: |
          npm run build:hotelbiz
          sed -i '' "s/appId: '.*'/appId: 'co.in.shopykart.hotelbiz'/" capacitor.config.ts
          npx cap sync ios
          cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/Shopykart-HotelBiz.xcarchive archive PRODUCT_BUNDLE_IDENTIFIER=co.in.shopykart.hotelbiz CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Archives
        uses: actions/upload-artifact@v4
        with:
          name: shopykart-hexa-archives
          path: ios/App/build/*.xcarchive
