name: Build Shopykart iOS Apps

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Static Web Assets
        run: npm run build:static

      # 1. CUSTOMER APP (co.in.shopykart.app)
      - name: Build Customer iOS Archive
        run: |
          sed -i '' "s/appId: '.*'/appId: 'co.in.shopykart.app'/" capacitor.config.ts
          sed -i '' "s/appName: '.*'/appName: 'Shopykart'/" capacitor.config.ts
          plutil -replace CFBundleDisplayName -string "Shopykart" ios/App/App/Info.plist
          npx cap sync ios
          cd ios/App && pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/Shopykart-Customer.xcarchive archive PRODUCT_BUNDLE_IDENTIFIER=co.in.shopykart.app CODE_SIGNING_ALLOWED=NO

      # 2. ADMIN APP (co.in.shopykart.admin)
      - name: Build Admin iOS Archive
        run: |
          sed -i '' "s/appId: '.*'/appId: 'co.in.shopykart.admin'/" capacitor.config.ts
          sed -i '' "s/appName: '.*'/appName: 'Shopykart Admin'/" capacitor.config.ts
          plutil -replace CFBundleDisplayName -string "Shopykart Admin" ios/App/App/Info.plist
          npx cap sync ios
          cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/Shopykart-Admin.xcarchive archive PRODUCT_BUNDLE_IDENTIFIER=co.in.shopykart.admin CODE_SIGNING_ALLOWED=NO

      # 3. BIZ / STORE APP (co.in.shopykart.biz)
      - name: Build Biz iOS Archive
        run: |
          sed -i '' "s/appId: '.*'/appId: 'co.in.shopykart.biz'/" capacitor.config.ts
          sed -i '' "s/appName: '.*'/appName: 'Shopykart Biz'/" capacitor.config.ts
          plutil -replace CFBundleDisplayName -string "Shopykart Biz" ios/App/App/Info.plist
          npx cap sync ios
          cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/Shopykart-Biz.xcarchive archive PRODUCT_BUNDLE_IDENTIFIER=co.in.shopykart.biz CODE_SIGNING_ALLOWED=NO

      # 4. FLEET / TOW APP (co.in.shopykart.tow)
      - name: Build Tow iOS Archive
        run: |
          sed -i '' "s/appId: '.*'/appId: 'co.in.shopykart.tow'/" capacitor.config.ts
          sed -i '' "s/appName: '.*'/appName: 'Shopykart Tow'/" capacitor.config.ts
          plutil -replace CFBundleDisplayName -string "Shopykart Tow" ios/App/App/Info.plist
          npx cap sync ios
          cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/Shopykart-Tow.xcarchive archive PRODUCT_BUNDLE_IDENTIFIER=co.in.shopykart.tow CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Archives
        uses: actions/upload-artifact@v4
        with:
          name: shopykart-ios-archives
          path: ios/App/build/*.xcarchive
