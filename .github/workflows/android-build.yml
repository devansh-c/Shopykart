name: Build Customer Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Customer APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Upgrade Gradle Wrapper to 8.5
        run: |
          sed -i 's/gradle-.*-all.zip/gradle-8.5-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK & AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleDebug --stacktrace

      - name: Prepare Artifacts
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app.shopykart.apk
          cp android/app/build/outputs/bundle/debug/app-debug.aab app.shopykart.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopykart-apk
          path: app.shopykart.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: shopykart-aab
          path: app.shopykart.aab
          if-no-files-found: error
