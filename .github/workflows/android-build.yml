
name: Build ShopyKart Customer App (Zero Error)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web Application
        run: npm run build:static

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Patch Gradle Settings (Cordova Plugin Fix)
        run: |
          if [ -d "android" ]; then
            cd android
            if ! grep -q "':capacitor-cordova-android-plugins'" settings.gradle; then
              echo "include ':capacitor-cordova-android-plugins'" >> settings.gradle
              echo "project(':capacitor-cordova-android-plugins').projectDir = new File('capacitor-cordova-android-plugins')" >> settings.gradle
            fi
            
            mkdir -p capacitor-cordova-android-plugins/src/main
            echo 'apply plugin: "com.android.library"' > capacitor-cordova-android-plugins/build.gradle
            echo 'android { compileSdkVersion 34; default { minSdk 22; targetSdk 34 } }' >> capacitor-cordova-android-plugins/build.gradle
            echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="capacitor.cordova.android.plugins"></manifest>' > capacitor-cordova-android-plugins/src/main/AndroidManifest.xml
          fi

      - name: Initialize Gradle Wrapper & Build APK
        working-directory: android
        run: |
          # Use system gradle to generate the wrapper if it doesn't exist
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ShopyKart-Customer.apk

      - name: Build Customer AAB (Play Store)
        working-directory: android
        run: |
          ./gradlew bundleDebug
          cp app/build/outputs/bundle/debug/app-debug.aab ../ShopyKart-Customer.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Customer-Build
          path: |
            ShopyKart-Customer.apk
            ShopyKart-Customer.aab
