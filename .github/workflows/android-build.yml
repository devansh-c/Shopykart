name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select App Build Variant (Manual)'
        required: true
        default: 'customer'
        type: choice
        options:
        - customer
        - admin
        - biz
        - tow

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [customer, admin, biz, tow]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Configure Unique Package Name
        run: |
          TYPE="${{ github.event.inputs.build_type || matrix.build_type }}"
          echo "Configuring Identity for: $TYPE"
          
          # Default Values (Customer)
          APP_ID="co.in.shopykart.app"
          APP_NAME="ShopyKart"

          if [ "$TYPE" == "admin" ]; then
            APP_ID="co.in.shopykart.admin"
            APP_NAME="ShopyKart Admin"
          elif [ "$TYPE" == "biz" ]; then
            APP_ID="co.in.shopykart.biz"
            APP_NAME="ShopyKart Partner"
          elif [ "$TYPE" == "tow" ]; then
            APP_ID="co.in.shopykart.tow"
            APP_NAME="ShopyKart Fleet"
          fi

          # Update capacitor.config.ts dynamically using sed
          sed -i "s/appId: '.*'/appId: '$APP_ID'/g" capacitor.config.ts
          sed -i "s/appName: '.*'/appName: '$APP_NAME'/g" capacitor.config.ts
          
          echo "Final Package ID: $APP_ID"
          echo "Final App Name: $APP_NAME"

      - name: Create Static Web Build
        run: |
          TYPE="${{ github.event.inputs.build_type || matrix.build_type }}"
          echo "Building ShopyKart variant: $TYPE"
          
          if [ "$TYPE" == "admin" ]; then
            npm run build:admin
          elif [ "$TYPE" == "biz" ]; then
            npm run build:biz
          elif [ "$TYPE" == "tow" ]; then
            npm run build:tow
          else
            npm run build:static
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Add/Sync Android
        run: |
          # Only add if directory doesn't exist, to preserve native config changes
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build App Bundle (Release)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-${{ github.event.inputs.build_type || matrix.build_type }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-${{ github.event.inputs.build_type || matrix.build_type }}-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab