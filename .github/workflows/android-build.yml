
name: Build ShopyKart Customer App (Zero Error Master)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web Application (Static Export)
        run: npm run build:static

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Patch Android Project (Critical Fix)
        run: |
          # 1. Force AndroidX and Jetifier
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties
          
          # 2. Stub missing capacitor-cordova-android-plugins module if missing
          # This prevents the "Project with path ':capacitor-cordova-android-plugins' could not be found" error
          mkdir -p android/capacitor-cordova-android-plugins/src/main
          if [ ! -f "android/capacitor-cordova-android-plugins/build.gradle" ]; then
            cat <<EOF > android/capacitor-cordova-android-plugins/build.gradle
            apply plugin: 'com.android.library'
            android {
                namespace 'co.in.shopykart.app.plugins'
                compileSdk 34
                defaultConfig { minSdk 23 }
            }
          EOF
          fi
          
          if [ ! -f "android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml" ]; then
            cat <<EOF > android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml
            <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="co.in.shopykart.app.plugins"></manifest>
          EOF
          fi
          
          # 3. Ensure module is included in settings.gradle
          if [ -f "android/settings.gradle" ]; then
            if ! grep -q ":capacitor-cordova-android-plugins" android/settings.gradle; then
              echo "include ':capacitor-cordova-android-plugins'" >> android/settings.gradle
              echo "project(':capacitor-cordova-android-plugins').projectDir = new File(settingsDir, 'capacitor-cordova-android-plugins')" >> android/settings.gradle
            fi
          fi

      - name: Build APK (Debug)
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../ShopyKart-Customer.apk

      - name: Build AAB (Release/Play Store Bundle)
        working-directory: android
        run: |
          ./gradlew bundleDebug --stacktrace
          cp app/build/outputs/bundle/debug/app-debug.aab ../ShopyKart-Customer.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Customer-Build
          path: |
            ShopyKart-Customer.apk
            ShopyKart-Customer.aab
