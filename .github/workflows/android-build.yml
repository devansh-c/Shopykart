name: Build ShopyKart Customer App (Master Grade)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Web Application (Static Export)
        run: npm run build:static

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Fix Gradle Permissions
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          else
            echo "Error: gradlew missing after sync. Attempting repair..."
            cd android && gradle wrapper --gradle-version 8.2.1 && cd ..
            chmod +x android/gradlew
          fi

      - name: Build APK (Debug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release Bundle (AAB)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Prepare ShopyKart Artifacts
        run: |
          echo "Locating and renaming build outputs..."
          
          # Find APK
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" app.shopykart.apk
          fi
          
          # Find AAB (Release prioritized)
          AAB_PATH=$(find android/app/build/outputs/bundle -name "*.aab" | grep "release" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find android/app/build/outputs/bundle -name "*.aab" | head -n 1)
          fi
          
          if [ -f "$AAB_PATH" ]; then
            cp "$AAB_PATH" app.shopykart.aab
          fi

      - name: Verify Final Files
        run: |
          ls -lh app.shopykart.apk || echo "APK Missing"
          ls -lh app.shopykart.aab || echo "AAB Missing"

      - name: Upload ShopyKart Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Build-Files
          path: |
            app.shopykart.apk
            app.shopykart.aab