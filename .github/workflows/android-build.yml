
name: Build ShopyKart Quad Apps (APK + AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Generate Quad Apps (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Dummy Keystore
        run: |
          test -f android/app/release.jks || keytool -genkey -noprompt -alias shopykart -dname "CN=ShopyKart, OU=IT, O=ShopyKart, L=Ranipur, S=UP, C=IN" -keystore android/app/release.jks -storepass shopykart123 -keypass shopykart123 -keyalg RSA -keysize 2048 -validity 10000

      # BUILD 1: CUSTOMER APP (co.in.shopykart.app)
      - name: Build & Sync Customer
        run: |
          npm run build:static
          sed -i "s/appId: [\"'].*[\"']/appId: \"co.in.shopykart.app\"/" capacitor.config.ts
          sed -i "s/appName: [\"'].*[\"']/appName: \"Shopykart\"/" capacitor.config.ts
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">Shopykart<\/string>/" android/app/src/main/res/values/strings.xml
          npx cap sync android

      - name: Build Android (Customer)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Archive Customer Files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk customer.shopykart.apk
          cp android/app/build/outputs/bundle/release/app-release.aab customer.shopykart.aab

      # BUILD 2: ADMIN APP (co.in.shopykart.admin)
      - name: Build & Sync Admin
        run: |
          export NEXT_PUBLIC_ADMIN_APP=true
          npm run build:admin
          sed -i "s/appId: [\"'].*[\"']/appId: \"co.in.shopykart.admin\"/" capacitor.config.ts
          sed -i "s/appName: [\"'].*[\"']/appName: \"Shopykart CEO\"/" capacitor.config.ts
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">Shopykart CEO<\/string>/" android/app/src/main/res/values/strings.xml
          npx cap sync android

      - name: Build Android (Admin)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Archive Admin Files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk admin.shopykart.apk
          cp android/app/build/outputs/bundle/release/app-release.aab admin.shopykart.aab

      # BUILD 3: STORE/BIZ APP (co.in.shopykart.biz)
      - name: Build & Sync Biz
        run: |
          export NEXT_PUBLIC_BIZ_APP=true
          npm run build:biz
          sed -i "s/appId: [\"'].*[\"']/appId: \"co.in.shopykart.biz\"/" capacitor.config.ts
          sed -i "s/appName: [\"'].*[\"']/appName: \"Shopykart Business\"/" capacitor.config.ts
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">Shopykart Business<\/string>/" android/app/src/main/res/values/strings.xml
          npx cap sync android

      - name: Build Android (Biz)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Archive Biz Files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk store.shopykart.apk
          cp android/app/build/outputs/bundle/release/app-release.aab store.shopykart.aab

      # BUILD 4: DELIVERY/TOW APP (co.in.shopykart.tow)
      - name: Build & Sync Tow
        run: |
          export NEXT_PUBLIC_TOW_APP=true
          npm run build:tow
          sed -i "s/appId: [\"'].*[\"']/appId: \"co.in.shopykart.tow\"/" capacitor.config.ts
          sed -i "s/appName: [\"'].*[\"']/appName: \"Shopykart Tow\"/" capacitor.config.ts
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">Shopykart Tow<\/string>/" android/app/src/main/res/values/strings.xml
          npx cap sync android

      - name: Build Android (Tow)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Archive Tow Files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk delivery.shopykart.apk
          cp android/app/build/outputs/bundle/release/app-release.aab delivery.shopykart.aab

      # UPLOAD ALL ARTIFACTS (APK + AAB)
      - name: Upload Complete Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-v1.4-Release-Files
          path: |
            *.apk
            *.aab
          if-no-files-found: error
