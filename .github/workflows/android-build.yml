
name: Build ShopyKart Customer App (Zero Error)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web Application
        run: npm run build:static

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Bulletproof Gradle Patch (Cordova Plugin Fix)
        run: |
          # 1. Ensure the capacitor-cordova-android-plugins module is included in settings.gradle
          if ! grep -q "':capacitor-cordova-android-plugins'" android/settings.gradle; then
            echo "include ':capacitor-cordova-android-plugins'" >> android/settings.gradle
            echo "project(':capacitor-cordova-android-plugins').projectDir = new File('capacitor-cordova-android-plugins')" >> android/settings.gradle
          fi

          # 2. Ensure the folder exists even if no plugins are used (satisfy Gradle evaluator)
          mkdir -p android/capacitor-cordova-android-plugins/src/main
          
          # Create a minimal build.gradle for the stub project
          echo 'apply plugin: "com.android.library"' > android/capacitor-cordova-android-plugins/build.gradle
          echo 'android { compileSdkVersion 34; default { minSdk 22; targetSdk 34 } }' >> android/capacitor-cordova-android-plugins/build.gradle
          
          # Create a minimal Manifest
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="capacitor.cordova.android.plugins"></manifest>' > android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml

      - name: Build APK (Gradle 8.2.1)
        run: |
          cd android
          # Force a specific stable Gradle version to avoid SelfResolvingDependency errors
          ./gradlew wrapper --gradle-version 8.2.1
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ShopyKart-Customer.apk

      - name: Build Play Store AAB
        run: |
          cd android
          ./gradlew bundleDebug
          cp app/build/outputs/bundle/debug/app-debug.aab ../ShopyKart-Customer.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Builds
          path: |
            ShopyKart-Customer.apk
            ShopyKart-Customer.aab
