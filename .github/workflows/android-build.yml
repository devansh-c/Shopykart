name: Build All ShopyKart Apps (APK & AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web (Base for Sync)
        run: npm run build:static

      - name: Initialize Android Project Files
        run: |
          mkdir -p android/app
          
          # 1. Create Root build.gradle
          cat <<EOF > android/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.1'
                  classpath 'com.google.gms:google-services:4.4.0'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          # 2. Create Root settings.gradle
          cat <<EOF > android/settings.gradle
          include ':app'
          apply from: 'capacitor.settings.gradle'
          EOF
          
          # 3. Sync Capacitor
          npx cap sync android
          
          # 4. CRITICAL FIX: Stub missing capacitor-cordova-android-plugins project
          # This prevents "Project with path ':capacitor-cordova-android-plugins' could not be found"
          mkdir -p android/capacitor-cordova-android-plugins
          cat <<EOF > android/capacitor-cordova-android-plugins/build.gradle
          apply plugin: 'com.android.library'
          android {
              namespace 'co.in.shopykart.app.plugins'
              compileSdk 34
          }
          EOF
          
          # 5. Force include in settings.gradle if sync missed it
          if ! grep -q "capacitor-cordova-android-plugins" android/settings.gradle; then
            echo "include ':capacitor-cordova-android-plugins'" >> android/settings.gradle
            echo "project(':capacitor-cordova-android-plugins').projectDir = new File('capacitor-cordova-android-plugins')" >> android/settings.gradle
          fi

          # 6. Ensure gradlew is executable with STABLE Gradle version (8.2.1)
          cd android
          if [ ! -f "gradlew" ]; then
            # We use a specific version to avoid Gradle 9+ deprecation errors
            gradle wrapper --gradle-version 8.2.1
          fi
          chmod +x gradlew
          cd ..

      # 1. BUILD CUSTOMER APP
      - name: Build Web (Customer)
        run: npm run build:static
      - name: Capacitor Sync & Build (Customer)
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../ShopyKart-Customer.apk
          mv app/build/outputs/bundle/debug/app-debug.aab ../ShopyKart-Customer.aab
          cd ..

      # 2. BUILD ADMIN APP
      - name: Build Web (Admin)
        run: npm run build:admin
      - name: Capacitor Sync & Build (Admin)
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../ShopyKart-Admin.apk
          mv app/build/outputs/bundle/debug/app-debug.aab ../ShopyKart-Admin.aab
          cd ..

      # 3. BUILD VENDOR APP (BIZ)
      - name: Build Web (Biz)
        run: npm run build:biz
      - name: Capacitor Sync & Build (Vendor)
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../ShopyKart-Vendor.apk
          mv app/build/outputs/bundle/debug/app-debug.aab ../ShopyKart-Vendor.aab
          cd ..

      # 4. BUILD DELIVERY APP (TOW)
      - name: Build Web (Tow)
        run: npm run build:tow
      - name: Capacitor Sync & Build (Delivery)
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../ShopyKart-Delivery.apk
          mv app/build/outputs/bundle/debug/app-debug.aab ../ShopyKart-Delivery.aab
          cd ..

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-All-APKs
          path: ShopyKart-*.apk

      - name: Upload AABs
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-All-AABs
          path: ShopyKart-*.aab
