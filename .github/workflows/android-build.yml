name: Build ShopyKart Customer App (APK & AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2.1

      - name: Build Web & Sync Capacitor
        run: |
          npm run build:static
          npx cap sync android

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew

      - name: Build Customer APK
        run: |
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ShopyKart-Customer.apk

      - name: Build Customer AAB
        run: |
          cd android
          ./gradlew bundleDebug
          cp app/build/outputs/bundle/debug/app-debug.aab ../ShopyKart-Customer.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Builds
          path: |
            ShopyKart-Customer.apk
            ShopyKart-Customer.aab
