name: Build ShopyKart Customer App (Zero Error)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web Application
        run: npm run build:static

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Patch Gradle Settings (Cordova Plugin Fix)
        run: |
          # Create missing folder to satisfy Gradle dependency checks
          mkdir -p android/capacitor-cordova-android-plugins/src/main
          
          # Inject project include into settings.gradle if missing
          if ! grep -q "':capacitor-cordova-android-plugins'" android/settings.gradle; then
            echo "include ':capacitor-cordova-android-plugins'" >> android/settings.gradle
            echo "project(':capacitor-cordova-android-plugins').projectDir = new File('capacitor-cordova-android-plugins')" >> android/settings.gradle
          fi
          
          # Ensure capacitor.settings.gradle is applied
          if ! grep -q "apply from: 'capacitor.settings.gradle'" android/settings.gradle; then
            echo "apply from: 'capacitor.settings.gradle'" >> android/settings.gradle
          fi
          
          # Create Manifest for the stub project
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="capacitor.cordova.android.plugins"></manifest>' > android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml
          
          # Create build.gradle for the stub project
          echo 'apply plugin: "com.android.library"' > android/capacitor-cordova-android-plugins/build.gradle
          echo 'android { compileSdkVersion 34; default { minSdk 22; targetSdk 34 } }' >> android/capacitor-cordova-android-plugins/build.gradle

      - name: Force Gradle 8.2.1 & Build APK
        run: |
          cd android
          # Overwrite wrapper version to ensure 8.2.1
          ./gradlew wrapper --gradle-version 8.2.1
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ShopyKart-Customer.apk

      - name: Build Customer AAB (Play Store)
        run: |
          cd android
          ./gradlew bundleDebug
          cp app/build/outputs/bundle/debug/app-debug.aab ../ShopyKart-Customer.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Builds
          path: |
            ShopyKart-Customer.apk
            ShopyKart-Customer.aab
