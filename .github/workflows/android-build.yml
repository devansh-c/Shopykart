
name: Build ShopyKart Customer App (Master Grade)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web Application (Static Export)
        run: npm run build:static

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Bulletproof Android Patching
        run: |
          mkdir -p android
          touch android/gradle.properties
          
          # Optimization for CI Runners - Force AndroidX & Memory limits
          # Using append mode (>>) to avoid clearing any required keys
          echo "" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties
          echo "android.nonTransitiveRClass=true" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          
          # Force fix for missing capacitor-cordova-android-plugins module
          # This is the primary reason for "Project not found" evaluation errors
          mkdir -p android/capacitor-cordova-android-plugins/src/main
          
          cat <<EOF > android/capacitor-cordova-android-plugins/build.gradle
          apply plugin: 'com.android.library'
          android {
              namespace 'co.in.shopykart.app.plugins'
              compileSdk 34
              defaultConfig {
                  minSdk 23
              }
          }
          EOF
          
          cat <<EOF > android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="co.in.shopykart.app.plugins"></manifest>
          EOF
          
          # Ensure module is properly included in settings.gradle without duplicates
          if [ -f "android/settings.gradle" ]; then
            if ! grep -q ":capacitor-cordova-android-plugins" android/settings.gradle; then
              echo "include ':capacitor-cordova-android-plugins'" >> android/settings.gradle
              echo "project(':capacitor-cordova-android-plugins').projectDir = new File(settingsDir, 'capacitor-cordova-android-plugins')" >> android/settings.gradle
            fi
          fi

      - name: Build APK (Debug)
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew
          # Build with limited workers and no daemon for maximum stability on GitHub Runner
          ./gradlew assembleDebug --stacktrace --max-workers=2 --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Customer-Build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
