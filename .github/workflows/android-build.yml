name: Build All ShopyKart Apps (APK & AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web (Base for Sync)
        run: npm run build:static

      - name: Initialize Android Project Files
        run: |
          mkdir -p android/app
          
          # Create Root build.gradle if missing
          echo "buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.1'
                  classpath 'com.google.gms:google-services:4.4.0'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }" > android/build.gradle
          
          # Create Root settings.gradle with Capacitor links (CRITICAL FIX)
          echo "include ':app'
          apply from: 'capacitor.settings.gradle'" > android/settings.gradle
          
          # Run Capacitor Sync to generate capacitor.settings.gradle and other links
          npx cap sync android
          
          # Generate gradlew if it doesn't exist
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          cd ..

      # 1. BUILD CUSTOMER APP
      - name: Build Web (Customer)
        run: npm run build:static
      - name: Capacitor Sync & Build (Customer)
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../ShopyKart-Customer.apk
          mv app/build/outputs/bundle/debug/app-debug.aab ../ShopyKart-Customer.aab
          cd ..

      # 2. BUILD ADMIN APP
      - name: Build Web (Admin)
        run: npm run build:admin
      - name: Capacitor Sync & Build (Admin)
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../ShopyKart-Admin.apk
          mv app/build/outputs/bundle/debug/app-debug.aab ../ShopyKart-Admin.aab
          cd ..

      # 3. BUILD VENDOR APP (BIZ)
      - name: Build Web (Biz)
        run: npm run build:biz
      - name: Capacitor Sync & Build (Vendor)
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../ShopyKart-Vendor.apk
          mv app/build/outputs/bundle/debug/app-debug.aab ../ShopyKart-Vendor.aab
          cd ..

      # 4. BUILD DELIVERY APP (TOW)
      - name: Build Web (Tow)
        run: npm run build:tow
      - name: Capacitor Sync & Build (Delivery)
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../ShopyKart-Delivery.apk
          mv app/build/outputs/bundle/debug/app-debug.aab ../ShopyKart-Delivery.aab
          cd ..

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-All-APKs
          path: ShopyKart-*.apk

      - name: Upload AABs
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-All-AABs
          path: ShopyKart-*.aab
