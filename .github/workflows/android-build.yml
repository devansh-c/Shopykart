
name: Build ShopyKart Customer App (Master Grade)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Web Application (Static Export)
        run: npm run build:static

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Industrial Build Repair & Sanitization
        run: |
          mkdir -p android/app
          cd android
          
          # 1. PURGE PHANTOM MODULES (Fixes SelfResolvingDependency & ClassNotFound)
          if [ -f "settings.gradle" ]; then
            echo "Deep cleaning settings.gradle..."
            sed -i "/:capacitor-cordova-android-plugins/d" settings.gradle
            sed -i "/project(':capacitor-android-plugins')/d" app/build.gradle || true
            sed -i "/project(':capacitor-cordova-android-plugins')/d" app/build.gradle || true
          fi

          if [ -f "app/build.gradle" ]; then
            echo "Repairing app dependencies..."
            sed -i "/project(':capacitor-cordova-android-plugins')/d" app/build.gradle
          fi
          
          # 2. FORCE GRADLE 8.2.1 (Capacitor 6 Gold Standard)
          echo "Generating Gradle Wrapper 8.2.1..."
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew

          # 3. WORKER ISOLATION & MEMORY LIMITS (AAPT2 Crash Fix)
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build APK (Debug)
        working-directory: android
        run: |
          # Single worker mode for maximum stability on low-resource runners
          ./gradlew assembleDebug --stacktrace --max-workers=1 --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Build-Artifacts
          path: |
            android/app/build/outputs/apk/debug/app-shopykart.apk
