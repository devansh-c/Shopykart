name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select App Build Variant'
        required: true
        default: 'customer'
        type: choice
        options:
        - customer
        - admin
        - biz
        - tow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Create Static Web Build
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "admin" ]; then
            echo "Building STANDALONE ADMIN APP..."
            npm run build:admin
          elif [ "${{ github.event.inputs.build_type }}" == "biz" ]; then
            echo "Building SHOPYKART BIZ (STORES) APP..."
            npm run build:biz
          elif [ "${{ github.event.inputs.build_type }}" == "tow" ]; then
            echo "Building SHOPYKART TOW (DELIVERY) APP..."
            npm run build:tow
          else
            echo "Building STANDARD CUSTOMER APP..."
            npm run build:static
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Add/Sync Android
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found. Adding platform..."
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build App Bundle (Release)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-${{ github.event.inputs.build_type || 'Customer' }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-${{ github.event.inputs.build_type || 'Customer' }}-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
