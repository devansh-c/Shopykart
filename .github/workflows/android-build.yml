
name: Build ShopyKart Customer App (Zero Error)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web Application
        run: npm run build:static

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Patch Gradle Settings (Fix Cordova Error)
        run: |
          # Ensure the missing project is defined in settings.gradle
          if ! grep -q ":capacitor-cordova-android-plugins" android/settings.gradle; then
            echo "include ':capacitor-cordova-android-plugins'" >> android/settings.gradle
            echo "project(':capacitor-cordova-android-plugins').projectDir = new File(settingsDir, 'capacitor-cordova-android-plugins')" >> android/settings.gradle
          fi
          
          # Create a dummy structure for the plugins module if it doesn't exist
          mkdir -p android/capacitor-cordova-android-plugins
          if [ ! -f android/capacitor-cordova-android-plugins/build.gradle ]; then
            cat <<EOF > android/capacitor-cordova-android-plugins/build.gradle
            apply plugin: 'com.android.library'
            android {
                namespace 'co.in.shopykart.app.plugins'
                compileSdk 34
                defaultConfig { minSdk 23 }
            }
          EOF
          fi

      - name: Initialize Gradle Wrapper
        working-directory: android
        run: |
          # Use system gradle to generate a stable wrapper
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew

      - name: Build Customer APK
        working-directory: android
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ShopyKart-Customer.apk

      - name: Build Customer AAB (Play Store)
        working-directory: android
        run: |
          ./gradlew bundleDebug
          cp app/build/outputs/bundle/debug/app-debug.aab ../ShopyKart-Customer.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Customer-Build
          path: |
            ShopyKart-Customer.apk
            ShopyKart-Customer.aab
