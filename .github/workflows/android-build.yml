
name: Build ShopyKart Quad Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Generate Quad App APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # CREATE DUMMY KEYSTORE FOR BUILD
      - name: Create Dummy Keystore
        run: |
          test -f android/app/release.jks || keytool -genkey -noprompt -alias shopykart -dname "CN=ShopyKart, OU=IT, O=ShopyKart, L=Ranipur, S=UP, C=IN" -keystore android/app/release.jks -storepass shopykart123 -keypass shopykart123 -keyalg RSA -keysize 2048 -validity 10000

      # BUILD 1: CUSTOMER APP (co.in.shopykart.app)
      - name: Build Web (Customer)
        run: npm run build:static
      
      - name: Prune Heavy Static Assets (Customer)
        run: |
          rm -rf out/store out/product out/page out/index.txt
          rm -rf android/app/src/main/assets/public/store android/app/src/main/assets/public/product android/app/src/main/assets/public/page android/app/src/main/assets/public/index.txt || true

      - name: Configure Customer Identity
        run: |
          sed -i "s/appId: [\"'].*[\"']/appId: \"co.in.shopykart.app\"/" capacitor.config.ts
          npx cap sync android

      - name: Build Android (Customer)
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease assembleRelease

      - name: Archive Customer
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk app.shopykart.apk
          cp android/app/build/outputs/bundle/release/app-release.aab app.shopykart.aab

      # BUILD 2: ADMIN APP (co.in.shopykart.admin)
      - name: Build Web (Admin)
        run: npm run build:admin
      
      - name: Prune Heavy Static Assets (Admin)
        run: |
          rm -rf out/store out/product out/page out/index.txt
          rm -rf android/app/src/main/assets/public/store android/app/src/main/assets/public/product android/app/src/main/assets/public/page android/app/src/main/assets/public/index.txt || true

      - name: Configure Admin Identity
        run: |
          sed -i "s/appId: [\"'].*[\"']/appId: \"co.in.shopykart.admin\"/" capacitor.config.ts
          npx cap sync android

      - name: Build Android (Admin)
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease assembleRelease

      - name: Archive Admin
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk admin.shopykart.apk
          cp android/app/build/outputs/bundle/release/app-release.aab admin.shopykart.aab

      # UPLOAD ARTIFACTS
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Quad-Apps
          path: |
            app.shopykart.apk
            admin.shopykart.apk
          if-no-files-found: error
