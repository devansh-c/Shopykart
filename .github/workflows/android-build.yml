name: Build ShopyKart Customer App (APK & AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.1'

      - name: Build Web & Sync Capacitor
        run: |
          npm run build:static
          npx cap sync android

      - name: Initialize Android Project
        run: |
          mkdir -p android/app
          
          # Create Root build.gradle
          cat <<EOF > android/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.1'
                  classpath 'com.google.gms:google-services:4.4.1'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          # Create Root settings.gradle
          cat <<EOF > android/settings.gradle
          include ':app'
          apply from: 'capacitor.settings.gradle'
          EOF
          
          # Fix missing capacitor-cordova-android-plugins dependency
          mkdir -p android/capacitor-cordova-android-plugins
          cat <<EOF > android/capacitor-cordova-android-plugins/build.gradle
          apply plugin: 'com.android.library'
          android {
              namespace 'co.in.shopykart.app.plugins'
              compileSdk 34
          }
          EOF
          
          if ! grep -q "capacitor-cordova-android-plugins" android/settings.gradle; then
            echo "include ':capacitor-cordova-android-plugins'" >> android/settings.gradle
            echo "project(':capacitor-cordova-android-plugins').projectDir = new File('capacitor-cordova-android-plugins')" >> android/settings.gradle
          fi

          cd android
          chmod +x gradlew
          cd ..

      - name: Build Customer APK
        run: |
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ShopyKart-Customer.apk

      - name: Build Customer AAB
        run: |
          cd android
          ./gradlew bundleDebug
          cp app/build/outputs/bundle/debug/app-debug.aab ../ShopyKart-Customer.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Customer-Build
          path: |
            ShopyKart-Customer.apk
            ShopyKart-Customer.aab
