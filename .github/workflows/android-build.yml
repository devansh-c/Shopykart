name: Build Android App (Customer)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android App (APK & AAB)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug --stacktrace

      - name: Rename Artifacts
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk Shopykart_customer.apk
          mv android/app/build/outputs/bundle/debug/app-debug.aab shopykart_customer.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shopykart-customer-builds
          path: |
            Shopykart_customer.apk
            shopykart_customer.aab
          if-no-files-found: warn
