name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Create Web Build
        run: npm run build:static

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Capacitor Android
        run: |
          rm -rf android
          npx cap add android
          
          # FORCE ASSET GENERATION FROM ASSETS FOLDER
          echo "Generating Branded Assets..."
          npx @capacitor/assets generate --android --assetPath assets || echo "Assets folder issue"
          
          npx cap sync android
          chmod +x android/gradlew

      - name: Build APK & AAB (Debug)
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleDebug

      - name: Get Current Time
        id: time
        run: echo "BUILD_TIME=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-APK-${{ env.BUILD_TIME }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-AAB-${{ env.BUILD_TIME }}
          path: android/app/build/outputs/bundle/debug/app-debug.aab
