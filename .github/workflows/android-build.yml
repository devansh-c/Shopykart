
name: Build ShopyKart Multi-App Suite

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fail-fast: false
        app-type: [customer, admin, biz, tow]
    env:
      GRADLE_OPTS: -Xmx2048m
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application (Dynamic Mode)
        run: |
          if [ "${{ matrix.app-type }}" == "admin" ]; then
            npm run build:admin
          elif [ "${{ matrix.app-type }}" == "biz" ]; then
            npm run build:biz
          elif [ "${{ matrix.app-type }}" == "tow" ]; then
            npm run build:tow
          else
            npm run build:static
          fi

      - name: Configure Native Identity
        run: |
          # Swap Package ID and App Name based on matrix type
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          BUILD_GRADLE="android/app/build.gradle"
          
          if [ "${{ matrix.app-type }}" == "admin" ]; then
            sed -i 's/ShopyKart/ShopyKart Admin/g' $STRINGS_FILE
            sed -i 's/co.in.shopykart.app/co.in.shopykart.admin/g' $BUILD_GRADLE
          elif [ "${{ matrix.app-type }}" == "biz" ]; then
            sed -i 's/ShopyKart/ShopyKart Biz/g' $STRINGS_FILE
            sed -i 's/co.in.shopykart.app/co.in.shopykart.biz/g' $BUILD_GRADLE
          elif [ "${{ matrix.app-type }}" == "tow" ]; then
            sed -i 's/ShopyKart/ShopyKart Tow/g' $STRINGS_FILE
            sed -i 's/co.in.shopykart.app/co.in.shopykart.tow/g' $BUILD_GRADLE
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Release Bundle (AAB)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Build APK (Release)
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Prepare Artifacts
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          cp "$APK_PATH" "shopykart_${{ matrix.app-type }}.apk"
          cp "$AAB_PATH" "shopykart_${{ matrix.app-type }}.aab"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-${{ matrix.app-type }}-Build
          path: |
            shopykart_${{ matrix.app-type }}.apk
            shopykart_${{ matrix.app-type }}.aab
