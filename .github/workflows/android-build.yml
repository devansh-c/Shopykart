
name: Build ShopyKart Hexa Apps (APK + AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Generate Hexa Apps (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Create Dummy Keystore
        run: |
          test -f android/app/release.keystore || keytool -genkey -noprompt -alias releasekey -dname "CN=ShopyKart, OU=IT, O=ShopyKart, L=Ranipur, S=UP, C=IN" -keystore android/app/release.keystore -storepass shopykart123 -keypass shopykart123 -keyalg RSA -keysize 2048 -validity 10000

      # BUILD 1: CUSTOMER APP (co.in.shopykart.app)
      - name: Build & Sync Customer
        run: |
          npm run build:static
          sed -i "s/appId: '.*'/appId: 'co.in.shopykart.app'/" capacitor.config.ts
          sed -i "s/appName: '.*'/appName: 'Shopykart'/" capacitor.config.ts
          npx cap sync android
        
      - name: Build Android (Customer)
        working-directory: android
        run: |
          sed -i 's/applicationId ".*"/applicationId "co.in.shopykart.app"/' app/build.gradle
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../customer.apk

      # BUILD 2: ADMIN APP
      - name: Build & Sync Admin
        env:
          NEXT_PUBLIC_ADMIN_APP: true
        run: |
          npm run build:admin
          sed -i "s/appId: '.*'/appId: 'co.in.shopykart.admin'/" capacitor.config.ts
          sed -i "s/appName: '.*'/appName: 'Shopykart CEO'/" capacitor.config.ts
          npx cap sync android

      - name: Build Android (Admin)
        working-directory: android
        run: |
          sed -i 's/applicationId ".*"/applicationId "co.in.shopykart.admin"/' app/build.gradle
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../admin.apk

      # BUILD 3: STORE BIZ APP
      - name: Build & Sync Biz
        env:
          NEXT_PUBLIC_BIZ_APP: true
        run: |
          npm run build:biz
          sed -i "s/appId: '.*'/appId: 'co.in.shopykart.biz'/" capacitor.config.ts
          sed -i "s/appName: '.*'/appName: 'Shopykart Biz'/" capacitor.config.ts
          npx cap sync android

      - name: Build Android (Biz)
        working-directory: android
        run: |
          sed -i 's/applicationId ".*"/applicationId "co.in.shopykart.biz"/' app/build.gradle
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../biz.apk

      # BUILD 4: DELIVERY FLEET APP
      - name: Build & Sync Tow
        env:
          NEXT_PUBLIC_TOW_APP: true
        run: |
          npm run build:tow
          sed -i "s/appId: '.*'/appId: 'co.in.shopykart.tow'/" capacitor.config.ts
          sed -i "s/appName: '.*'/appName: 'Shopykart Fleet'/" capacitor.config.ts
          npx cap sync android

      - name: Build Android (Fleet)
        working-directory: android
        run: |
          sed -i 's/applicationId ".*"/applicationId "co.in.shopykart.tow"/' app/build.gradle
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../fleet.apk

      # BUILD 5: HOTELWALE CUSTOMER APP (co.in.shopykart.hotel)
      - name: Build & Sync Hotel
        env:
          NEXT_PUBLIC_HOTEL_APP: true
        run: |
          npm run build:hotel
          sed -i "s/appId: '.*'/appId: 'co.in.shopykart.hotel'/" capacitor.config.ts
          sed -i "s/appName: '.*'/appName: 'Hotelwale'/" capacitor.config.ts
          npx cap sync android

      - name: Build Android (Hotel)
        working-directory: android
        run: |
          sed -i 's/applicationId ".*"/applicationId "co.in.shopykart.hotel"/' app/build.gradle
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../hotelwale.apk

      # BUILD 6: HOTELWALE BIZ PARTNER APP (co.in.shopykart.hotelbiz)
      - name: Build & Sync HotelBiz
        env:
          NEXT_PUBLIC_HOTEL_BIZ_APP: true
        run: |
          npm run build:hotelbiz
          sed -i "s/appId: '.*'/appId: 'co.in.shopykart.hotelbiz'/" capacitor.config.ts
          sed -i "s/appName: '.*'/appName: 'Hotelwale Partner'/" capacitor.config.ts
          npx cap sync android

      - name: Build Android (HotelBiz)
        working-directory: android
        run: |
          sed -i 's/applicationId ".*"/applicationId "co.in.shopykart.hotelbiz"/' app/build.gradle
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../hotelbiz.apk

      # UPLOAD ALL ARTIFACTS
      - name: Upload Complete Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Hexa-Apps-Release
          path: |
            *.apk
          if-no-files-found: error
