name: Build ShopyKart Customer App (Zero Error)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web Application
        run: npm run build:static

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Patch Gradle Settings (Cordova Plugin Fix)
        run: |
          # Ensure capacitor.settings.gradle is applied in settings.gradle
          if ! grep -q "apply from: 'capacitor.settings.gradle'" android/settings.gradle; then
            echo "apply from: 'capacitor.settings.gradle'" >> android/settings.gradle
          fi
          
          # Force create capacitor-cordova-android-plugins if expected by build.gradle but missing
          mkdir -p android/capacitor-cordova-android-plugins/src/main
          if [ ! -f android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="capacitor.cordova.android.plugins"></manifest>' > android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml
          fi
          if [ ! -f android/capacitor-cordova-android-plugins/build.gradle ]; then
            echo 'apply plugin: "com.android.library"' > android/capacitor-cordova-android-plugins/build.gradle
            echo 'android { compileSdkVersion 34; default { minSdkVersion 22; targetSdkVersion 34 } }' >> android/capacitor-cordova-android-plugins/build.gradle
          fi

      - name: Initialize Gradle Wrapper & Build APK
        run: |
          cd android
          # Force Gradle 8.2.1 which is stable for Capacitor 6
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ShopyKart-Customer.apk

      - name: Build Customer AAB (Play Store)
        run: |
          cd android
          ./gradlew bundleDebug
          cp app/build/outputs/bundle/debug/app-debug.aab ../ShopyKart-Customer.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Builds
          path: |
            ShopyKart-Customer.apk
            ShopyKart-Customer.aab
