
name: Build ShopyKart Dual Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Generate Customer and Admin APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # BUILD 1: CUSTOMER APP (co.in.shopykart.app)
      - name: Build Web Assets (Customer)
        run: npm run build:static
      
      - name: Configure Customer Identity
        run: |
          sed -i "s/appId: [\"'].*[\"']/appId: \"co.in.shopykart.app\"/" capacitor.config.ts
          sed -i "s/appName: [\"'].*[\"']/appName: \"ShopyKart\"/" capacitor.config.ts
          sed -i 's/package_name">.*<\/string>/package_name">co.in.shopykart.app<\/string>/' android/app/src/main/res/values/strings.xml
          sed -i 's/app_name">.*<\/string>/app_name">ShopyKart<\/string>/' android/app/src/main/res/values/strings.xml
          # Fix Java Package
          find android/app/src/main/java -name "MainActivity.java" -exec sed -i "s/package co.in.shopykart.admin/package co.in.shopykart.app/" {} +
          find android/app/src/main/java -name "MainActivity.java" -exec sed -i "s/package co.in.shopykart.app/package co.in.shopykart.app/" {} +
          npx cap sync android

      - name: Build Android (Customer)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Prepare Customer Artifacts
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app.shopykart.apk
          cp android/app/build/outputs/bundle/release/app-release.aab app.shopykart.aab

      # BUILD 2: ADMIN APP (co.in.shopykart.admin)
      - name: Build Web Assets (Admin)
        run: npm run build:admin
      
      - name: Configure Admin Identity
        run: |
          sed -i "s/appId: [\"'].*[\"']/appId: \"co.in.shopykart.admin\"/" capacitor.config.ts
          sed -i "s/appName: [\"'].*[\"']/appName: \"ShopyKart Admin\"/" capacitor.config.ts
          sed -i 's/package_name">.*<\/string>/package_name">co.in.shopykart.admin<\/string>/' android/app/src/main/res/values/strings.xml
          sed -i 's/app_name">.*<\/string>/app_name">ShopyKart Admin<\/string>/' android/app/src/main/res/values/strings.xml
          # Fix Java Package
          find android/app/src/main/java -name "MainActivity.java" -exec sed -i "s/package co.in.shopykart.app/package co.in.shopykart.admin/" {} +
          npx cap sync android

      - name: Build Android (Admin)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Prepare Admin Artifacts
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk admin.shopykart.apk
          cp android/app/build/outputs/bundle/release/app-release.aab admin.shopykart.aab

      # UPLOAD ALL ARTIFACTS
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Builds
          path: |
            app.shopykart.apk
            app.shopykart.aab
            admin.shopykart.apk
            admin.shopykart.aab
          if-no-files-found: error
