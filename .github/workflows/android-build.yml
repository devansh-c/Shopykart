
name: Build ShopyKart Customer App (Master Grade)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Web Application (Static Export)
        run: npm run build:static

      - name: Build System Diagnostic
        run: |
          echo "Checking Repository Structure..."
          pwd
          ls -la
          echo "Checking Android Directory..."
          if [ -d "android" ]; then
            ls -la android
          else
            echo "Android directory missing entirely!"
          fi

      - name: Sync or Add Capacitor Android
        run: |
          # If the android folder exists but is broken (no gradlew), we need to ensure it's initialized
          if [ -d "android" ] && [ ! -f "android/gradlew" ]; then
            echo "Android project incomplete (missing gradlew). Attempting repair..."
            # Remove partial folder to allow 'cap add' to recreate a valid structure
            rm -rf android
            npx cap add android
          elif [ ! -d "android" ]; then
            echo "Adding Android platform..."
            npx cap add android
          fi
          echo "Syncing web assets..."
          npx cap sync android

      - name: Industrial Build Repair & Sanitization
        working-directory: android
        run: |
          # 1. OPTIMIZE GRADLE PROPERTIES (Memory & Stability)
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" > gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.daemon=true" >> gradle.properties
          echo "org.gradle.vfs.watch=false" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=false" >> gradle.properties
          
          # 2. ENSURE EXECUTION PERMISSIONS
          chmod +x gradlew

      - name: Build APK (Debug)
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Build-Artifacts
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
