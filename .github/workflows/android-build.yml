
name: Build ShopyKart Customer App (Master Grade)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Web Application (Static Export)
        run: npm run build:static

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Industrial Build Repair & Sanitization
        run: |
          mkdir -p android
          cd android
          
          # 1. OPTIMIZE GRADLE PROPERTIES (Memory & Stability)
          # We use >> to append or ensure we don't destroy native capacitor settings
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" > gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.daemon=true" >> gradle.properties
          echo "org.gradle.vfs.watch=false" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=false" >> gradle.properties
          
          # 2. FORCE GRADLE 8.2.1 (Capacitor 6 Gold Standard)
          echo "Generating Gradle Wrapper 8.2.1..."
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.2.1

      - name: Build APK (Debug)
        working-directory: android
        run: |
          # Remove --max-workers=1 to allow Gradle to manage resource efficiently with the 4GB heap
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Build-Artifacts
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            
