
name: Build ShopyKart Customer App (Master Grade)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Web Application (Static Export)
        run: npm run build:static

      - name: Sync or Add Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Build System Diagnostic & Repair
        run: |
          echo "Checking Android Directory Structure..."
          if [ ! -f "android/gradlew" ]; then
            echo "Gradle wrapper missing. Forcing regeneration..."
            cd android && gradle wrapper --gradle-version 8.2.1 && cd ..
          fi
          chmod +x android/gradlew

      - name: Industrial Build Sanitization
        working-directory: android
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" > gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=false" >> gradle.properties

      - name: Build APK (Debug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release Bundle (AAB)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Prepare Final Output Names
        run: |
          echo "Renaming Build Artifacts..."
          # Copy APK to root with custom name
          cp android/app/build/outputs/apk/debug/app-debug.apk app.shopykart.apk
          
          # Find and Copy AAB (Checking both signed and unsigned paths)
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -f "$AAB_PATH" ]; then
            cp "$AAB_PATH" app.shopykart.aab
          else
            echo "AAB not found in standard release path, checking alternative..."
            cp android/app/build/outputs/bundle/debug/app-debug.aab app.shopykart.aab || echo "AAB Copy Failed"
          fi

      - name: Verify Final Files
        run: |
          ls -lh app.shopykart.apk
          ls -lh app.shopykart.aab || echo "AAB check skipped"

      - name: Upload ShopyKart Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Build-Files
          path: |
            app.shopykart.apk
            app.shopykart.aab
