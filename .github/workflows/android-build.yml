
name: Build ShopyKart Customer App (Master Grade)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web Application (Static Export)
        run: npm run build:static

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Master Grade Android Patching
        run: |
          mkdir -p android/app
          
          # 1. FORCE REMOVE MISSING CORDOVA PLUGINS FROM GRADLE EVALUATION
          if [ -f "android/settings.gradle" ]; then
            echo "Inspecting settings.gradle for phantom modules..."
            # Remove any line containing the phantom cordova project
            sed -i "/:capacitor-cordova-android-plugins/d" android/settings.gradle
          fi

          if [ -f "android/app/build.gradle" ]; then
            echo "Cleaning app/build.gradle from cordova phantom dependencies..."
            # Remove implementation reference to the phantom module
            sed -i "/project(':capacitor-cordova-android-plugins')/d" android/app/build.gradle
          fi
          
          # 2. REPAIR MISSING GRADLE WRAPPER
          if [ ! -f "android/gradlew" ]; then
            echo "Gradlew missing! Generating wrapper..."
            cd android && gradle wrapper || echo "Fallback: Using local gradle if available"
            cd ..
          fi
          
          # 3. OPTIMIZE GRADLE PROPERTIES (APPEND MODE)
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: Build APK (Debug)
        working-directory: android
        run: |
          # Ensure execution permission
          if [ -f "gradlew" ]; then chmod +x gradlew; fi
          # Build with strictly limited workers to prevent runner memory crash
          ./gradlew assembleDebug --stacktrace --max-workers=1 --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Customer-Build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
