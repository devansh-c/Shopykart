name: Build ShopyKart Android Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Customer & Admin Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # BUILD 1: CUSTOMER APP (co.in.shopykart.app)
      - name: Build Web Assets (Customer)
        run: npm run build:static
      
      - name: Set Customer Package Identity
        run: |
          sed -i 's/appId: "co.in.shopykart.admin"/appId: "co.in.shopykart.app"/' capacitor.config.ts
          sed -i 's/package_name">co.in.shopykart.admin/package_name">co.in.shopykart.app/' android/app/src/main/res/values/strings.xml
          sed -i 's/package co.in.shopykart.admin/package co.in.shopykart.app/' android/app/src/main/java/co/in/shopykart/admin/MainActivity.java
      
      - name: Sync Capacitor (Customer)
        run: npx cap sync android

      - name: Build Android (Customer)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m"

      - name: Prepare Customer Artifacts
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app.shopykart.apk
          cp android/app/build/outputs/bundle/release/app-release.aab app.shopykart.aab

      # BUILD 2: ADMIN APP (co.in.shopykart.admin)
      - name: Build Web Assets (Admin)
        run: npm run build:admin
      
      - name: Set Admin Package Identity
        run: |
          sed -i 's/appId: "co.in.shopykart.app"/appId: "co.in.shopykart.admin"/' capacitor.config.ts
          sed -i 's/package_name">co.in.shopykart.app/package_name">co.in.shopykart.admin/' android/app/src/main/res/values/strings.xml
          sed -i 's/package co.in.shopykart.app/package co.in.shopykart.admin/' android/app/src/main/java/co/in/shopykart/admin/MainActivity.java
      
      - name: Sync Capacitor (Admin)
        run: npx cap sync android

      - name: Build Android (Admin)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m"

      - name: Prepare Admin Artifacts
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk admin.shopykart.apk
          cp android/app/build/outputs/bundle/release/app-release.aab admin.shopykart.aab

      # UPLOAD ALL ARTIFACTS
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-APKs
          path: |
            app.shopykart.apk
            admin.shopykart.apk
          if-no-files-found: error

      - name: Upload AABs (App Bundles)
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Bundles
          path: |
            app.shopykart.aab
            admin.shopykart.aab
          if-no-files-found: error
