
name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select App Build Variant (Manual)'
        required: true
        default: 'customer'
        type: choice
        options:
        - customer
        - admin
        - biz
        - tow

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [customer, admin, biz, tow]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Configure Identity
        run: |
          TYPE="${{ github.event.inputs.build_type || matrix.build_type }}"
          echo "Configuring Identity for: $TYPE"
          APP_ID="co.in.shopykart.app"
          APP_NAME="ShopyKart"
          if [ "$TYPE" == "admin" ]; then
            APP_ID="co.in.shopykart.admin"
            APP_NAME="ShopyKart Admin"
          elif [ "$TYPE" == "biz" ]; then
            APP_ID="co.in.shopykart.biz"
            APP_NAME="ShopyKart Partner"
          elif [ "$TYPE" == "tow" ]; then
            APP_ID="co.in.shopykart.tow"
            APP_NAME="ShopyKart Fleet"
          fi
          sed -i "s/appId: '.*'/appId: '$APP_ID'/g" capacitor.config.ts
          sed -i "s/appName: '.*'/appName: '$APP_NAME'/g" capacitor.config.ts

      - name: Create Web Build
        run: |
          TYPE="${{ github.event.inputs.build_type || matrix.build_type }}"
          if [ "$TYPE" == "admin" ]; then
            npm run build:admin
          elif [ "$TYPE" == "biz" ]; then
            npm run build:biz
          elif [ "$TYPE" == "tow" ]; then
            npm run build:tow
          else
            npm run build:static
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Capacitor Android
        run: |
          # FORCE REGENERATE ANDROID TO REMOVE DEFAULT CAPACITOR ICONS
          rm -rf android
          npx cap add android
          
          # FORCE GENERATE SHOPYKART ICONS FROM ASSETS (12-DAY ICON FIX)
          if [ -f "assets/icon.png" ]; then
            echo "ShopyKart Logo detected. Generating all Android icons..."
            npx @capacitor/assets generate --android --assetPath assets
          else
            echo "WARNING: assets/icon.png not found! Using default icons."
          fi
          
          npx cap sync android
          
          # ENSURE GRADLEW IS EXECUTABLE
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          else
            echo "ERROR: gradlew generation failed even after cap add. Forcing exit."
            exit 1
          fi

      - name: Build APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Get Current Time
        id: time
        run: echo "BUILD_TIME=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-${{ github.event.inputs.build_type || matrix.build_type }}-${{ env.BUILD_TIME }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
