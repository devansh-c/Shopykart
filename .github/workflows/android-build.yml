
name: Build ShopyKart Customer App (Master Grade)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Web Application (Static Export)
        run: npm run build:static

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Master Grade Android Patching
        run: |
          mkdir -p android/app
          
          # 1. CLEAN PHANTOM MODULES FROM SETTINGS
          if [ -f "android/settings.gradle" ]; then
            echo "Cleaning settings.gradle..."
            sed -i "/:capacitor-cordova-android-plugins/d" android/settings.gradle
          fi

          if [ -f "android/app/build.gradle" ]; then
            echo "Cleaning app/build.gradle..."
            sed -i "/project(':capacitor-cordova-android-plugins')/d" android/app/build.gradle
          fi
          
          # 2. FORCE STABLE GRADLE VERSION (Fixes ClassNotFoundException)
          if [ -d "android" ]; then
            cd android
            gradle wrapper --gradle-version 8.2.1
            cd ..
          fi

          # 3. OPTIMIZE MEMORY FOR GITHUB RUNNER
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: Build APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --max-workers=2 --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopyKart-Customer-Build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
